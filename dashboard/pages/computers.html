<div data-title="Computers" class="mx-auto max-w-7xl space-y-6">
  <div>
    <h1 class="font-display text-2xl font-semibold tracking-tight">Computers</h1>
    <p class="mt-1 text-sm text-slate-500">Every registered computer and its latest readings. Select a computer to see its charts.</p>
  </div>

  <section class="rounded-xl border border-slate-200 bg-white" aria-label="Computers list">
    <div class="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
      <div class="relative sm:w-72">
        <label for="computer-search" class="sr-only">Search computers by name</label>
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input id="computer-search" type="search" autocomplete="off" placeholder="Search by name"
               class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
      </div>
      <div class="flex items-center gap-2" role="group" aria-label="Filter by status">
        <button type="button" data-filter="all" aria-pressed="true" class="chip">All</button>
        <button type="button" data-filter="online" aria-pressed="false" class="chip">Online</button>
        <button type="button" data-filter="offline" aria-pressed="false" class="chip">Offline</button>
      </div>
    </div>

    <!-- Loaded and refreshed by HTMX every 30 seconds -->
    <div id="computers-table" hx-get="partials/computers-table.html" hx-trigger="load, every 30s" hx-indicator="this">
      <div class="px-5 pb-6">
        <div class="animate-pulse space-y-4" aria-hidden="true"><div class="h-10 rounded bg-slate-100"></div><div class="h-10 rounded bg-slate-100"></div><div class="h-10 rounded bg-slate-100"></div><div class="h-10 rounded bg-slate-100"></div></div><span class="sr-only">Loading</span>
      </div>
    </div>

    <p id="result-count" class="border-t border-slate-100 px-5 py-3 text-xs text-slate-500" aria-live="polite">Showing 6 of 6 computers</p>
  </section>
</div>
